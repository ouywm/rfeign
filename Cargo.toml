[workspace]
resolver = "2"
members = [
    "rfeign-core",
    "rfeign-macros",
    "rfeign-reqwest",
    "rfeign",
    "examples/basic",
    "examples/imperative",
    "examples/with-retry",
    "examples/with-nacos",
    "examples/file-upload",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ouywm"]
repository = "https://github.com/ouywm/rfeign"
categories = ["web-programming::http-client", "asynchronous"]
keywords = ["http-client", "declarative", "feign", "microservice", "async"]

[workspace.dependencies]
rfeign = { path = "rfeign", version = "0.0.1" }
rfeign-core = { path = "rfeign-core", version = "0.0.1" }
rfeign-macros = { path = "rfeign-macros", version = "0.0.1" }
rfeign-reqwest = { path = "rfeign-reqwest", version = "0.0.1" }
http = "1.4"
bytes = "1.11"
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
mime = "0.3"
async-trait = "0.1"
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
futures-core = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
erased-serde = "0.4"
thiserror = "2.0"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
darling = "0.23"
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
reqwest-tracing = "0.7"
backon = "1.6"
recloser = "1.3"
tracing = "0.1"
nacos-sdk = "0.8"
rs-consul = "0.14"
base64 = "0.22"